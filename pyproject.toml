[build-system]
build-backend = "hatchling.build"
requires = [ "hatch-vcs>=0.5,<1", "hatchling>=1.27,<2" ]

[project]
name = "meltanolabs-target-csv"
description = "Singer target for CSV, built with the Meltano SDK for Singer Targets."
readme = "README.md"
keywords = [
  "CSV",
  "ELT",
  "ETL",
  "Meltano",
  "Meltano SDK",
  "Singer",
]
license = "Apache-2.0"
requires-python = ">=3.10"
classifiers = [
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
]
dynamic = [ "version" ]
dependencies = [
  "singer-sdk~=0.54.5",
  "typing-extensions>=4.16.0 ; python_full_version < '3.12'",
]
[[project.authors]]
name = "Meltano"
email = "hello@meltano.com"
[project.scripts]
target-csv = "meltanolabs_target_csv.target:TargetCSV.cli"

[dependency-groups]
dev = [
  { include-group = "test" },
]
test = [
  "pytest>=8.3,<10",
  "pytest-github-actions-annotate-failures>=0.3",
  "singer-sdk[testing]",
]

[tool.hatch.version]
fallback-version = "0.0.0"
source = "vcs"

[tool.ruff]
line-length = 88
[tool.ruff.lint]
ignore = [
  "ANN401", # Allow `typing.Any` as parameter type
]
extend-select = [
  "ANN",  # flake8-annotations
  "B",    # flake8-bugbear
  "C90",  # mccabe
  "D",    # pydocstyle
  "E",    # pycodestyle (error)
  "F",    # pyflakes
  "FA",   # flake8-future-annotations
  "FURB", # refurb
  "PERF", # Perflint
  "UP",   # pyupgrade
  "S",    # flake8-bandit
  "SIM",  # flake8-simplify
  "TC",   # flake8-type-checking
  "W",    # pycodestyle (warning)
]
[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true
[tool.ruff.lint.per-file-ignores]
"**/tests/*" = [ "ANN", "D1", "S101" ]
[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest]
addopts = ["-ra"]
filterwarnings = [
  "error",
  "once:Python 3.10 will reach its end of life on 2026-10:singer_sdk.helpers._compat.SingerSDKPythonEOLWarning",
  "once:The property `output_path_prefix` is deprecated, please use `output_path`.:UserWarning",
]
log_level = "INFO"
minversion = "9"
strict = true
testpaths = ["tests"]

[tool.ty.rules]
missing-override-decorator = "error"
